name: Build and Release Contracts
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release-nonprofit-registry:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}-nonprofit-registry
      relative_path: 'contracts'
      package: 'nonprofit-registry'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-campaign-registry:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}-campaign-registry
      relative_path: 'contracts'
      package: 'campaign-registry'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-campaign-vault:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}-campaign-vault
      relative_path: 'contracts'
      package: 'campaign-vault'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-donation-router:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}-donation-router
      relative_path: 'contracts'
      package: 'donation-router'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  release-governance-account:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}-governance-account
      relative_path: 'contracts'
      package: 'governance-account'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
