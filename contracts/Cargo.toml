[workspace]
resolver = "2"
members = [
    "protocol-types",
    "protocol-interfaces",
    "nonprofit-registry",
    "campaign-registry",
    "campaign-vault",
    "donation-router",
    "governance-account",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Bitajón"]
license = "MIT"

[workspace.dependencies]
#https://github.com/stellar/rs-soroban-sdk
#https://crates.io/crates/soroban-sdk
soroban-sdk = "29.0.1"
protocol-types = { path = "protocol-types" }
protocol-interfaces = { path = "protocol-interfaces" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
